name: guardrails
on: [push, pull_request]
jobs:
  no-game-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_no_game_files.py --all
      - run: python tools/build_balance.py --check
      - run: python tools/build_codex.py --check
      - run: python tools/gsc_lint.py
